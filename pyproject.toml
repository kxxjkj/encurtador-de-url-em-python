[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "encurtador-url-cli"
version = "1.0.0"
description = "Encurtador de URLs via terminal com histórico e clipboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "pyperclip>=1.8.2",
]

[project.scripts]
encurtar = "src.cli:app"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
